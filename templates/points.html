<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points | GUDLFT</title>
</head>
<body>
    <h1>Points of each club</h1>
    <table>
        <tr><th>Club</th><th>Points</th></tr>
        {% for club in clubs %}
        <tr><td>{{ club['name'] }}</td><td>{{ club['points'] }}</td></tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('index') }}">Back to login</a>
</body>
</html>
